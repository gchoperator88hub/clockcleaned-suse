name: Build openSUSE and Universal Linux App

on:
  push:
    branches: [ "main" ]

jobs:
  build-suse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Build frontend
        run: node ./scripts/build.mjs

      - name: Install RPM and Flatpak build tools
        run: |
          sudo apt-get update 
          sudo apt-get install -y rpm flatpak flatpak-builder imagemagick
          # Fixed Flathub URL to resolve the GPG summary error
          flatpak remote-add --user --if-not-exists flathub https://dl.flathub.org/repo/flathub.flatpakrepo

      - name: Install Required Flatpak Runtime Environments
        run: |
          # Install runtime and SDK elements directly
          flatpak install --user -y flathub org.freedesktop.Platform//23.08
          flatpak install --user -y flathub org.freedesktop.Sdk//23.08

      - name: Generate Required App Icon
        run: |
          mkdir -p build
          convert -size 512x512 canvas:blue build/icon.png

      - name: Build Electron RPM, AppImage, and Flatpak installers
        run: npx electron-builder --linux rpm AppImage flatpak --publish never

      - name: Upload Linux Installers
        uses: actions/upload-artifact@v4
        with:
          name: linux-installers
          path: |
            dist/*.rpm
            dist/*.AppImage
            dist/*.flatpak
